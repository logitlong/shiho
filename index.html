<link rel="stylesheet" href="style.css?v=179618f98f">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>

<body>
<header class="top">
  <a class="brand" href="#/">司法学习站</a>
  <span class="goal" id="goal" title="考试日期可以在右上角「设置」里改"></span>
  <nav class="main-nav"><a href="#/review">复习</a><a href="#/practice">答案练习</a><a href="#/laws">条文</a><a href="#/cases">判例</a><a href="#/fav">收藏</a></nav>
  <label class="qbox" title="输入词语回车 = 全文搜索；输入「民法94」「憲法21条1項」回车 = 看条文">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
    <input id="lawQ" placeholder="搜索 · 查条文（民法94）"></label>
  <div class="tools">
    <a class="tool sync-btn" id="syncBtn" href="#/sync" title="同步与设置"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18.5h10a4 4 0 0 0 .6-7.95A5.5 5.5 0 0 0 7 9.6 4.5 4.5 0 0 0 7 18.5z"/></svg></a>

<main id="app"></main>
<div class="help" id="help" hidden></div>
